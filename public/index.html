<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitbucket Pull-Requests Tree</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script src="theme-bootstrap.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
</head>
<body>
<header class="app-header">
  <button type="button" id="sidebarToggle" class="icon-button" aria-expanded="true" aria-controls="sidebar"
          aria-label="Toggle filters" title="Toggle filters (F)">
    <i class="fas fa-bars" aria-hidden="true"></i>
    <span id="activeFilterBadge" class="header-badge" hidden></span>
  </button>
  <h1 class="app-brand">
    <img src="favicon.svg" alt="" class="app-logo">
    <span class="app-name">Bitbucket Pull-Requests Tree</span>
  </h1>
  <select id="projectSelect" class="project-select" aria-label="Project">
    <option value="">Select a project</option>
  </select>
  <div class="header-spacer"></div>
  <div class="refresh-container">
    <i class="fas fa-sync refresh-icon" id="refreshIcon" title="Checking for updates"></i>
    <span id="atlassianPause" class="atlassian-pause" role="status" hidden>
      <i class="fas fa-exclamation-triangle" aria-hidden="true"></i>
      <span class="atlassian-pause-text"></span>
    </span>
    <span id="partialData" class="partial-data" role="status" hidden>
      <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
      <span class="partial-data-text"></span>
    </span>
    <span id="pageUpdated" class="page-updated" role="status" hidden>
      <button type="button" class="page-updated-button">
        <i class="fas fa-redo" aria-hidden="true"></i>
        <span class="page-updated-text">Reload: dashboard updated</span>
      </button>
    </span>
    <span class="last-refresh" id="lastRefreshTime"></span>
  </div>
  <button type="button" id="themeToggle" class="icon-button" aria-label="Switch to dark theme" title="Switch to dark theme">
    <i class="fas fa-moon" aria-hidden="true"></i>
  </button>
  <button type="button" id="helpButton" class="icon-button" aria-label="Help" title="Help">
    <i class="fas fa-question-circle" aria-hidden="true"></i>
  </button>
  <a href="https://github.com/frejfrej/pr-tree" target="_blank" rel="noopener" class="icon-button"
     aria-label="GitHub repository" title="GitHub repository">
    <i class="fab fa-github" aria-hidden="true"></i>
  </a>
  <span id="versionNumber" class="version-number"></span>
</header>

<aside id="sidebar" class="sidebar" aria-label="Filters">
  <div class="sidebar-header">
    <h2>Filters</h2>
    <button type="button" id="clearFiltersButton" class="link-button" hidden>Clear filters</button>
  </div>

  <div class="text-filter" role="search">
    <i class="fas fa-search text-filter-icon" aria-hidden="true"></i>
    <input type="search" id="textFilter" class="text-filter-input" placeholder="Title, branch or issue key"
           aria-label="Search pull requests" title="Search pull requests (/)" autocomplete="off" spellcheck="false">
    <button type="button" id="textFilterClear" class="text-filter-clear" aria-label="Clear search" hidden>
      <i class="fas fa-times" aria-hidden="true"></i>
    </button>
  </div>

  <div class="filter-item">
    <span class="filter-label"><span id="sprintSelectLabel">Sprint</span></span>
    <div class="multi-select" id="sprintSelect"></div>
  </div>

  <div class="filter-item">
    <span class="filter-label"><span id="fixVersionSelectLabel">Fix version</span></span>
    <div class="multi-select" id="fixVersionSelect"></div>
  </div>

  <div class="filter-item">
    <span class="filter-label"><span id="epicSelectLabel">Epic</span>
      <i class="fas fa-info-circle info-icon"
         title="Epic of the linked issues; for a sub-task, the epic of its parent story"></i>
    </span>
    <div class="multi-select" id="epicSelect"></div>
  </div>

  <div class="filter-item">
    <span class="filter-label"><span id="storySelectLabel">Story</span>
      <i class="fas fa-info-circle info-icon"
         title="Issue delivered by the pull request: the linked issue, or the parent of a linked sub-task"></i>
    </span>
    <div class="multi-select" id="storySelect"></div>
  </div>

  <div class="filter-item">
    <span class="filter-label"><span id="participantSelectLabel">Participants</span>
      <i class="fas fa-info-circle info-icon"
         title="Assignees of the linked issues and reviewers of the pull requests"></i>
    </span>
    <div class="multi-select" id="participantSelect"></div>
  </div>

  <div class="filter-item">
    <span class="filter-label"><label for="workSelect">Work</label>
      <i class="fas fa-info-circle info-icon"
         title="All work: every pull request the selected participants review or have a linked issue assigned to. All reviews: every pull request they review. All issues: every pull request with a linked issue assigned to them. Ready for participants: those waiting for them. Ready for reviewers: in review, not a draft and not approved by them. Ready for assignees: with a linked issue assigned to them, in progress or with open tasks."></i>
    </span>
    <select id="workSelect" disabled>
      <option value="all">All work</option>
      <option value="reviews">All reviews</option>
      <option value="issues">All issues</option>
      <option value="ready">Ready for participants</option>
      <option value="reviewers">Ready for reviewers</option>
      <option value="assignees">Ready for assignees</option>
    </select>
  </div>

  <div class="filter-item">
    <label class="checkbox-filter" for="hideDraftsCheckbox">
      <input type="checkbox" id="hideDraftsCheckbox">
      Hide drafts
    </label>
  </div>

  <hr class="sidebar-divider">

  <div class="filter-item">
    <span class="filter-label"><label for="syncSelect">SYNC</label>
      <i class="fas fa-info-circle info-icon"
         title="SYNC status is only fetched when you click the load button. This filter will be reset when the page is reloaded"></i>
    </span>
    <select id="syncSelect" disabled>
      <option value="Show all">SYNC status not loaded</option>
    </select>
    <div class="filter-row">
      <button type="button" id="loadSyncButton" class="button" disabled aria-label="Load SYNC status"
              title="Load SYNC status for all pull requests">
        <i class="fas fa-sync-alt" aria-hidden="true"></i> Load
      </button>
      <span id="syncWarning" class="sync-warning" hidden>
        <i class="fas fa-exclamation-triangle"></i>
      </span>
    </div>
  </div>
</aside>
<div id="sidebarBackdrop" class="sidebar-backdrop"></div>

<main id="main" class="main-pane">
  <div id="treeToolbar" class="tree-toolbar" hidden>
    <button type="button" id="collapseAllButton" class="link-button">
      <i class="fas fa-compress-alt" aria-hidden="true"></i> Collapse all
    </button>
    <button type="button" id="expandAllButton" class="link-button">
      <i class="fas fa-expand-alt" aria-hidden="true"></i> Expand all
    </button>
  </div>
  <div id="pull-requests" class="tree-pane"></div>
</main>

<dialog id="helpModal" class="modal" aria-label="Help">
  <div class="modal-content">
    <button type="button" id="helpClose" class="icon-button modal-close" aria-label="Close help">
      <i class="fas fa-times" aria-hidden="true"></i>
    </button>
    <!-- The closing tag must absolutely remain immediately next to the open tag -->
    <div id="helpContent" class="help-content"></div>
  </div>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
